<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Page Not Found</title>
    <style>
        :root {
            --bg: #f8f8f8;
            --fg: #2d2d2d;
            --muted: #6b7280;
            --accent: #2563eb;
            --card: #ffffff;
            --shadow: rgba(0,0,0,0.08);
        }
        /* Base layout */
        html, body { height: 100%; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font: 16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
            display: grid;
            place-items: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 2px 8px var(--shadow);
            padding: 32px 28px;
            max-width: 540px;
            width: calc(100% - 32px);
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: fadeIn 500ms ease-out both;
        }

        .code {
            font-size: clamp(64px, 12vw, 112px);
            font-weight: 800;
            letter-spacing: -2px;
            line-height: 0.9;
            margin: 0 0 8px;
            position: relative;
            animation: float 3.5s ease-in-out infinite;
        }

        /* Soft shadow under the code that breathes with the float */
        .shadow {
            width: 60%;
            height: 10px;
            margin: 10px auto 0;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0) 70%);
            filter: blur(4px);
            transform-origin: center;
            animation: breathe 3.5s ease-in-out infinite;
        }

        h2 {
            margin: 14px 0 8px;
            font-size: clamp(18px, 2.5vw, 22px);
            font-weight: 600;
        }

        p {
            margin: 0 0 18px;
            color: var(--muted);
            font-size: 15px;
        }

        .actions {
            display: inline-flex;
            gap: 10px;
            margin-top: 6px;
        }

        a.button {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.2px;
            transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
            box-shadow: 0 6px 14px rgba(37, 99, 235, 0.25);
        }
        a.button:hover { transform: translateY(-1px); }
        a.button:active { transform: translateY(0); box-shadow: 0 3px 8px rgba(37, 99, 235, 0.25); }
        a.link {
            display: inline-block;
            padding: 10px 12px;
            color: var(--accent);
            text-decoration: none;
        }
        a.link:hover { text-decoration: underline; }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.35; }
            50% { transform: scale(0.9); opacity: 0.2; }
        }

        /* Respect users who prefer reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .card, .code, .shadow, .button { animation: none !important; transition: none !important; }
        }
    </style>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="404 — The page you are looking for could not be found." />
    <link rel="icon" href="data:," />
    <!-- No external assets. Pure HTML + CSS for reliability. -->
    <!-- If you want to unify styles with other error pages, keep palette and spacing consistent. -->
</head>
<body>
    <main class="card" role="main" aria-labelledby="code" aria-describedby="message">
        <div class="code" id="code">404</div>
        <div class="shadow" aria-hidden="true"></div>
        <h2 id="message">Page not found</h2>
        <p>The page you're looking for doesn't exist or was moved.</p>
        <div class="actions">
            <a class="button" href="/">Go home</a>
            <a class="link" href="#" onclick="history.back(); return false;">Go back</a>
        </div>
    </main>
</body>
</html>
