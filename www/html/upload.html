<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link rel="icon" type="image/x-icon" href="/logo.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --text-color: #f0f0f0; --text-muted-color: #a0a0a0; --glass-bg: rgba(22, 22, 22, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1); --primary-color: #007bff; --success-color: #28a745;
        }
        body { min-height: 100vh; font-family: 'Inter', sans-serif; margin: 0; background-color: #050505; color: var(--text-color);
            background-image: radial-gradient(circle at 10% 10%, #007bff 0%, transparent 40%),
                              radial-gradient(circle at 85% 90%, #8a2be2 0%, transparent 40%);
            background-attachment: fixed; overflow-y: auto; }
        .page-wrapper { opacity: 0; animation: fadeIn 1s ease-out forwards; }
        .header { position: sticky; top: 20px; margin: 20px auto; max-width: 1200px; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 16px; z-index: 10; }
        .header a { color: var(--text-color); text-decoration: none; font-weight: 600; display: flex; align-items: center; }
        .header svg { width: 20px; height: 20px; margin-right: 8px; }
        .main-container { padding: 0 40px 40px 40px; max-width: 800px; margin: 0 auto; }
        .content-card { background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 20px; padding: 40px; border: 1px solid var(--glass-border); text-align: center; }
        h2 { font-size: 2.2rem; font-weight: 700; margin-top: 0; margin-bottom: 30px; }
        .upload-area { border: 2px dashed var(--glass-border); border-radius: 12px; padding: 40px; text-align: center; cursor: pointer; transition: background-color 0.3s, border-color 0.3s; }
        .upload-area:hover { background-color: rgba(0,0,0,0.2); }
        .upload-area.drag-over { border-color: var(--primary-color); background-color: rgba(0, 123, 255, 0.1); }
        .upload-area .icon svg { width: 50px; height: 50px; color: var(--text-muted-color); margin-bottom: 15px; }
        .upload-area .text { font-weight: 600; }
        .upload-area .subtext { font-size: 0.9rem; color: var(--text-muted-color); }
        input[type="file"] { display: none; }
        .btn { padding: 14px; margin-top: 25px; background-color: var(--primary-color); border: none; border-radius: 12px; color: #ffffff; font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; min-width: 200px; transition: background-color 0.3s ease, transform 0.2s ease; }
        .btn:hover { background-color: #0056b3; transform: translateY(-2px); }
        .message-icon svg { width: 60px; height: 60px; color: var(--success-color); margin-bottom: 20px; }
        .message-text { font-size: 1.1rem; color: var(--text-muted-color); }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body>
<div class="page-wrapper">
    <header class="header">
        <a href="/cgi/welcome.py">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" /></svg>
            Back to Dashboard
        </a>
        <span>{{title}}</span>
    </header>
    <main class="main-container">
        <div class="content-card">
            {{content}}
        </div>
    </main>
</div>
<script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const uploadText = document.getElementById('uploadText');

    if (uploadArea) {
        // Click to upload
        uploadArea.addEventListener('click', () => fileInput.click());

        // Update text when a file is selected via the dialog
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                uploadText.textContent = `File selected: ${fileInput.files[0].name}`;
            }
        });

        // --- DRAG & DROP LOGIC ---

        // Prevent default browser behavior for drag and drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // Highlight drop area when item is dragged over it
        ['dragenter', 'dragover'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => uploadArea.classList.add('drag-over'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => uploadArea.classList.remove('drag-over'), false);
        });

        // Handle dropped files
        uploadArea.addEventListener('drop', (e) => {
            let dt = e.dataTransfer;
            let files = dt.files;

            if (files.length > 0) {
                fileInput.files = files; // Assign dropped files to the input
                uploadText.textContent = `File selected: ${files[0].name}`;
            }
        }, false);
    }
</script>
</body>
</html>
