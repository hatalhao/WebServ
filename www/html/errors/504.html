<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>504 Gateway Timeout</title>
    <link rel="icon" type="image/x-icon" href="/logo.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --text-color: #f0f0f0; --text-muted-color: #a0a0a0; --glass-bg: rgba(22, 22, 22, 0.4); --glass-border: rgba(255, 255, 255, 0.1); --primary-color: #007bff; }
        body { font-family: 'Inter', sans-serif; margin: 0; background-color: #050505; color: var(--text-color); background-image: radial-gradient(circle at 10% 90%, #8a2be2 0%, transparent 40%), radial-gradient(circle at 90% 10%, #007bff 0%, transparent 40%); background-attachment: fixed; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .error-container { max-width: 480px; width: 100%; background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 40px; text-align: center; opacity: 0; transform: scale(0.95); animation: fadeIn 1s ease-out forwards; }
        .error-code { font-size: 4rem; font-weight: 700; margin: 0; color: var(--primary-color); }
        h1 { font-size: 1.8rem; font-weight: 600; margin-top: 10px; margin-bottom: 10px; }
        p { color: var(--text-muted-color); margin-bottom: 30px; line-height: 1.6; }
        .btn-home { display: inline-block; padding: 12px 30px; background-color: var(--primary-color); border: none; border-radius: 12px; color: #ffffff; font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: background-color 0.3s ease, transform 0.2s ease; }
        .btn-home:hover { background-color: #0056b3; transform: translateY(-2px); }
        @keyframes fadeIn { to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">504</div>
        <h1>Gateway Timeout</h1>
        <p>The server took too long to respond. Please try again later.</p>
        <a href="/index.html" class="btn-home">Go to Homepage</a>
    </div>
</body>
</html>
