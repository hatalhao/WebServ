<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>504 Gateway Timeout</title>
	<style>
		body {
			background: #181818;
			color: #fff;
			font-family: 'Segoe UI', Arial, sans-serif;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			height: 100vh;
			margin: 0;
			overflow: hidden;
		}
		.circle {
			width: 80px;
			height: 80px;
			border: 4px solid #444;
			border-top: 4px solid #ff5252;
			border-radius: 50%;
			animation: spin 1s linear infinite;
			margin-bottom: 32px;
		}
		@keyframes spin {
			0% { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}
		h1 {
			font-size: 2.5rem;
			margin: 0 0 12px 0;
			letter-spacing: 2px;
		}
		p {
			font-size: 1.1rem;
			color: #bbb;
			margin: 0;
		}
		.fade-in {
			opacity: 0;
			animation: fadeIn 1.2s ease forwards;
			animation-delay: 0.5s;
		}
		@keyframes fadeIn {
			to { opacity: 1; }
		}
	</style>
</head>
<body>
	<div class="circle"></div>
	<h1 class="fade-in">504 Gateway Timeout</h1>
	<p class="fade-in" style="animation-delay:1s;">The server took too long to respond.<br>Please try again later.</p>
</body>
</html>
