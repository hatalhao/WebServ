<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Failed</title>
    <link rel="icon" type="image/x-icon" href="/logo.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --text-color: #f0f0f0; --text-muted-color: #a0a0a0; --glass-bg: rgba(22, 22, 22, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1); --danger-color: #dc3545;
        }
        body {
            font-family: 'Inter', sans-serif; margin: 0; background-color: #050505; color: var(--text-color);
            background-image: radial-gradient(circle at 10% 90%, #8a2be2 0%, transparent 40%),
                              radial-gradient(circle at 90% 10%, #007bff 0%, transparent 40%);
            background-attachment: fixed; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
        }
        .error-container {
            max-width: 420px; width: 100%; background: var(--glass-bg); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 40px; text-align: center; opacity: 0;
            transform: scale(0.95); animation: fadeIn 1s ease-out forwards;
        }
        .error-icon { color: var(--danger-color); width: 50px; height: 50px; margin: 0 auto 20px auto; }
        h1 { font-size: 1.8rem; font-weight: 700; margin-top: 0; margin-bottom: 10px; }
        p { color: var(--text-muted-color); margin-bottom: 30px; }
        .btn-try-again {
            display: inline-block; width: 80%; padding: 14px; background-color: var(--danger-color); border: none;
            border-radius: 12px; color: #ffffff; font-size: 1rem; font-weight: 600; cursor: pointer;
            text-decoration: none; transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .btn-try-again:hover { background-color: #c82333; transform: translateY(-2px); }
        @keyframes fadeIn { to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
            </svg>
        </div>
        <h1>Login Failed</h1>
        <p>The username or password you entered is incorrect.</p>
        <a href="/index.html" class="btn-try-again">Try Again</a>
    </div>
</body>
</html>
