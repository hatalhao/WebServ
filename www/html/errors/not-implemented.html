<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feature Not Implemented</title>

    <style>
        /* General styling for the whole page */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            background-color: #f0f2f5; /* A light grey background */
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Make the body take the full viewport height */
            text-align: center;
        }

        /* A container to hold our content and center it nicely */
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* A subtle shadow */
            max-width: 500px;
            width: 90%;
        }

        /* Styling for the main headline */
        h1 {
            color: #1c1e21;
            font-size: 2.5em; /* 2.5 times the base font size */
            margin-bottom: 10px;
        }

        /* Styling for the descriptive paragraph */
        p {
            color: #606770;
            font-size: 1.1em;
            margin-bottom: 30px;
        }

        /* Styling for the "Go Back" link to make it look like a button */
        .back-link {
            display: inline-block;
            padding: 12px 24px;
            background-color: #007bff; /* A nice blue color */
            color: #ffffff; /* White text */
            text-decoration: none; /* Remove the default underline from the link */
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.3s ease; /* Smooth transition on hover */
        }

        /* Change the background color when the user hovers over the link */
        .back-link:hover {
            background-color: #0056b3; /* A darker blue */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Under Construction</h1>
        <p>
            Sorry, this feature is not yet available. Our team is working hard to bring it to you soon. Thank you for your patience!
        </p>
        <a href="#" class="back-link">Go to Homepage</a>
    </div>

</body>
</html>
