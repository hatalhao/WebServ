<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webserv Portal Login</title>
    <link rel="icon" type="image/x-icon" href="logo.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --text-color: #f0f0f0;
            --text-muted-color: #a0a0a0;
            --glass-bg: rgba(22, 22, 22, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary-color: #007bff;
            --primary-hover-color: #0056b3;
            --glow-color: rgba(0, 123, 255, 0.5);
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background-color: #050505;
            color: var(--text-color);
            background-image: radial-gradient(circle at 10% 90%, #8a2be2 0%, transparent 40%),
                              radial-gradient(circle at 90% 10%, #007bff 0%, transparent 40%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            max-width: 420px;
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            opacity: 0;
            transform: scale(0.95);
            animation: fadeIn 1s ease-out forwards;
        }

        .login-container h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .login-container p {
            color: var(--text-muted-color);
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-muted-color);
            font-size: 0.9rem;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            background-color: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-color);
            font-size: 1rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.25);
        }
        
        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
        }

        .btn-login:hover {
            background-color: var(--primary-hover-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 123, 255, 0.4);
        }

        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: var(--text-muted-color);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>Webserv Portal</h1>
        <p>Please sign in to access your dashboard.</p>
        <form action="/cgi/login.py" method="post">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>
        <div class="footer">
            &copy; 2025 Webserv Project. All rights reserved.
        </div>
    </div>

</body>
</html>
