[[server]]
server_name = ["example", "name1"]
host = "127.0.0.1"
listen = ["8989", "4000"]
root = "/home/aderraj/Desktop/WebServ/www/"
max_body_size = "100GB"
index = ["accueil.html", "welcome.html", "indexFile.html"]

[[location]]
name = "/"
path = "/home/aderraj/Desktop/WebServ/www/html"
index = ["index.html"]
autoindex = "on"
allow = ["GET", "DELETE", "POST"]
upload_path = "/home/aderraj/Desktop/WebServ/www/uploads"

[[location]]
name = "/uploads"
allow = ["POST", "GET"]
index = ["welcome.py", "welcome.html", "indexFile.html"]
path = "/tmp"
upload_path = "/tmp/"

[[location]]
name = "/cgi"
path = "/home/aderraj/Desktop/WebServ/www/cgi"
allow = ["GET", "POST"]
upload_path = "/home/aderraj/Desktop/WebServ/www/uploads"
index = ["welcome.py"]
autoindex = "on"
[[cgi]]
extension = ".py"
handler = "/usr/bin/python3.10"
[[cgi]]
extension = ".php"
handler = "/usr/bin/php"


