[[server]]
server_name = ["sekhar", "awd", "awdaw", "aawdawd"]
host = "127.0.0.1"
listen = ["8989", "8080", "8081"]
root = "/home/hatalhao/Ti"
[[error_pages]]
403 = "./pages/403.html"
404 = "./pages/404.html"
413 = "./pages/413.html"

[[location]]
name = "/images"
path = "/home/hatalhao/images"
index = ["index.html", "index.php", "indexFile.html"]
autoindex = ["on"]
allow = ["GET", "POST", "DELETE"]
rewrite = ["/home/hatalhao/photos", "/home/hatalhao/pictures"]
