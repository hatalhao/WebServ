[[server]]
server_name = ["sekhar", "awd", "aawdawd"]
host = "127.0.0.1"
listen = ["8989", "8080", "8081"]
root = "/home/"
[[error_pages]]
403 = "403.html"
404 = "404.html"
413 = "413.html"
[[location]]
name = "/images"
path = "/home/hatalhao/images"
index = ["index.html", "index.php", "indexFile.html"]
autoindex = "on"
allow = ["GET", "POST", "DELETE"]
