[[server]]
server_name = "sekhar"
host = "127.0.0.1"
listen = "8989"
root = "/home/"
[[error_pages]]
403 = "403.html"
404 = "404.html"
413 = "413.html"
[[location]]
# root = "/home"
"/images/insd/" = "/home/hatalhao/images"
[[location]]

[[cgi]]
extension = ".py"
handler = "/usr/bin/python3"
[[cgi]]
extension = ".php"
handler = "/usr/bin/php"


