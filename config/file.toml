[[server]]
server_name = ["sekhar", "awd", "awdaw", "aawdawd"]
host = "127.0.0.1"
listen = ["8989", "8080", "8081"]
root = "/home/hatalhao/42-cc/WebServ"
max_body_size = "15GB"

[[error_pages]]
403 = "./pages/403.html"
404 = "./pages/404.html"
413 = "./pages/413.html"

[[location]]
name = "images"
path = "/home/hatalhao/42-cc/WebServ"
index = ["images.html", "images.php", "imagesFile.html"]
autoindex = ["on"]
allow = ["GET", "DELETE", "POST"]
upload_path = "/home/hatalhao/uploads"
return = "/home/hatalhao/pictures"
[[cgi]]
extension = ".py"
handler = "/usr/bin/python3"

